[project]
name = "btcusd-sniper-v2"
version = "0.1.0"
description = "Low-latency BTCUSD sniper bot scaffold with strategy, risk, and execution modules."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
